<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>税务稽查案件与复议流程</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    input, select, textarea { padding: .4rem; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; margin: .5rem 0; flex-wrap: wrap; }
    section { border-top: 1px solid #dde3e8; margin-top: 1.5rem; padding-top: 1rem; }
  </style>
</head>
<body>
<main>
  <h1>税务稽查案件与复议流程</h1>
  <p>最小演示页。完整业务流程通过README中的JSON接口调用。</p>
  <div class="row"><button id="load">加载记录</button><button id="stats">查看状态统计</button></div>
  <section>
    <h2>分期缴纳与结案证明</h2>
    <div class="row">
      <label>记录ID <input id="rid" type="number" value="1" min="1"></label>
      <button id="viewPlan">查看分期计划</button>
      <button id="cert">开具结案证明</button>
    </div>
    <h3>申请分期（纳税人代表）</h3>
    <div class="row"><textarea id="applyBody" rows="7" style="width:100%"></textarea></div>
    <div class="row"><button id="apply">提交分期申请</button></div>
    <h3>复核分期（复核人员）</h3>
    <div class="row">
      <label>计划ID <input id="planId" type="number" min="1"></label>
      <select id="decision"><option value="approve">批准</option><option value="return">退回</option></select>
      <input id="note" placeholder="复核意见（退回必填）" size="28">
      <button id="review">提交复核</button>
    </div>
    <h3>登记实缴（复核人员）</h3>
    <div class="row">
      <label>计划ID <input id="payPlanId" type="number" min="1"></label>
      <label>期次 <input id="paySeq" type="number" min="1"></label>
      <label>金额 <input id="payAmount" type="number" min="0" step="0.01"></label>
      <label>缴款日 <input id="payDate" type="date"></label>
      <button id="pay">登记实缴</button>
    </div>
  </section>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
async function call(method, path, body) {
  const options = {method, headers: Object.assign({"Content-Type":"application/json"}, headers)};
  if (body !== undefined) options.body = JSON.stringify(body);
  const response = await fetch(path, options);
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
const rid = () => document.getElementById("rid").value;
const fmt = d => d.toISOString().slice(0, 10);
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return fmt(d); };
document.getElementById("applyBody").value = JSON.stringify({installments: [{due_date: plusDays(10), amount: 0}, {due_date: plusDays(40), amount: 0}]}, null, 2);
document.getElementById("payDate").value = fmt(new Date());
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("viewPlan").onclick = () => show("/api/records/" + rid() + "/installments");
document.getElementById("cert").onclick = () => show("/api/records/" + rid() + "/closure-certificate");
document.getElementById("apply").onclick = () => call("POST", "/api/records/" + rid() + "/installments", JSON.parse(document.getElementById("applyBody").value));
document.getElementById("review").onclick = () => call("POST", "/api/records/" + rid() + "/installments/" + document.getElementById("planId").value + "/review", {decision: document.getElementById("decision").value, note: document.getElementById("note").value});
document.getElementById("pay").onclick = () => call("POST", "/api/records/" + rid() + "/installments/" + document.getElementById("payPlanId").value + "/payments", {seq: Number(document.getElementById("paySeq").value), amount: Number(document.getElementById("payAmount").value), paid_date: document.getElementById("payDate").value});
</script>
</body>
</html>
